name: ciudad-enduro

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # 5432 and 5433 are taken by other local projects
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-dbs.sh:/docker-entrypoint-initdb.d/20-init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ciudad_enduro"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3 API stand-in for R2 (plan §9 V6): the official MinIO images are no longer published.
  # No auth and path-style URLs; GET needs no signature, so the browser reads photos directly.
  # The buckets exist at start; their files do not survive a restart of the container.
  s3mock:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ciudad-enduro-media,ciudad-enduro-media-test
    ports:
      - "9090:9090"

volumes:
  pgdata:
