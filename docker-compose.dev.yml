name: ciudad-enduro

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # 5432 and 5433 are taken by other local projects
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-dbs.sh:/docker-entrypoint-initdb.d/20-init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ciudad_enduro"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
